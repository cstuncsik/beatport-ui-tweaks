allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  lmdb: true
  msgpackr-extract: true
  sharp: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 has not declared ESLint 10 support yet, lint runs clean on it
    'eslint-plugin-react>eslint': '10'
